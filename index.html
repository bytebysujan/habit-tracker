<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Habit Tracker</title>
    <style>
        :root {
            --bg: #eef0ee;
            --card: #fff;
            --ink: #111;
            --mut: #777;
            --line: #d5d8d5;
            --fill: #111;
            --on: #fff;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b0b0b;
                --card: #161616;
                --ink: #f1f1f1;
                --mut: #999;
                --line: #2c2c2c;
                --fill: #f1f1f1;
                --on: #111
            }
        }

        :root[data-theme="dark"] {
            --bg: #0b0b0b;
            --card: #161616;
            --ink: #f1f1f1;
            --mut: #999;
            --line: #2c2c2c;
            --fill: #f1f1f1;
            --on: #111
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 12px
        }

        h1 {
            font-size: 18px;
            margin: 0;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            background: var(--fill);
            color: var(--on);
            padding: 12px;
            border-radius: 10px
        }

        .bar select,
        .bar input,
        .bar button {
            font: inherit;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink)
        }

        .bar input {
            width: 72px
        }

        .grid2 {
            display: grid;
            gap: 10px;
            margin-top: 10px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr))
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            min-width: 0
        }

        .card h2 {
            margin: 0 0 8px;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mut)
        }

        .kpis {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between
        }

        .kpi {
            margin-bottom: 8px
        }

        .kpi b {
            display: block;
            font-size: 24px
        }

        .kpi span {
            color: var(--mut);
            font-size: 12px
        }

        .wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        .g td,
        .g th {
            padding: 0;
            text-align: center;
            border-bottom: 1px solid var(--line)
        }

        .g th {
            font-size: 10px;
            color: var(--mut);
            font-weight: 500;
            min-width: 26px
        }

        .g .n {
            position: sticky;
            left: 0;
            background: var(--fill);
            color: var(--on);
            text-align: left;
            padding: 8px 10px;
            min-width: 150px;
            white-space: nowrap;
            z-index: 1;
            font-size: 13px
        }

        .g td.c {
            height: 34px;
            min-width: 26px
        }

        .g input[type=checkbox] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--fill);
            vertical-align: middle
        }

        .g input.x {
            width: 26px;
            border: 0;
            background: transparent;
            color: var(--ink);
            text-align: center;
            font: inherit;
            font-size: 12px;
            padding: 6px 0
        }

        .pb {
            height: 10px;
            background: var(--line);
            border-radius: 5px;
            overflow: hidden;
            min-width: 60px
        }

        .pb i {
            display: block;
            height: 100%;
            background: var(--fill)
        }

        .a td,
        .a th {
            padding: 6px 4px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 13px
        }

        .a th {
            font-size: 11px;
            color: var(--mut);
            font-weight: 500
        }

        button.s {
            font: inherit;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            margin-top: 8px
        }

        .del {
            background: none;
            border: 0;
            color: var(--on);
            font-size: 16px;
            padding: 0 6px;
            cursor: pointer
        }
    </style>
</head>

<body>
    <div class="bar">
        <h1>Habit Tracker</h1>
        <div><select id="mo"></select> <input id="yr" type="number" inputmode="numeric"></div>
    </div>
    <div class="grid2">
        <div class="card">
            <h2>Overview</h2>
            <div class="kpis">
                <div id="kp"></div>
                <div id="donut"></div>
            </div>
        </div>
        <div class="card">
            <h2>Daily progress</h2>
            <div id="bars"></div>
        </div>
    </div>
    <div class="card" style="margin-top:10px">
        <h2>My habits <span style="float:right;text-transform:none;letter-spacing:0">scroll →</span></h2>
        <div class="wrap" id="grid"></div>
        <button class="s" id="add">+ Add habit</button> <button class="s" id="edit">Edit habits</button>
    </div>
    <div class="grid2">
        <div class="card">
            <h2>Analysis</h2>
            <div class="wrap" id="an"></div>
        </div>
        <div class="card">
            <h2>Top habits</h2>
            <div id="top"></div>
        </div>
    </div>
    <script>
        const DEF = ["⏰ Wake up at 05:00", "💪 Gym", "📖 Reading / Learning", "🗒️ Day Planning", "🚫 No Gooning", "🛠️ Project Work", "🍷 No Alcohol", "📵 Social Media Detox", "✍️ Goal Journaling", "🚿 Cold Shower", "🚶 10k Steps", "📅 Plan Tomorrow"];
        const MN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let S = load(), editing = false; const now = new Date(); let Y = now.getFullYear(), M = now.getMonth();
        function load() { try { const r = localStorage.getItem('ht1'); if (r) return JSON.parse(r) } catch (e) { } return { habits: DEF.map((n, i) => ({ id: 'h' + i, name: n })), checks: {}, extra: {} } }
        function save() { try { localStorage.setItem('ht1', JSON.stringify(S)) } catch (e) { } }
        const $ = s => document.querySelector(s);
        const ym = () => Y + '-' + M, dim = () => new Date(Y, M + 1, 0).getDate();
        const get = id => S.checks[ym() + '|' + id] || [];
        function stats() {
            const n = dim(), H = S.habits;
            const per = H.map(h => { const a = get(h.id).filter(d => d <= n).length; return { h, a, p: n ? Math.round(a / n * 100) : 0 } });
            const done = per.reduce((s, x) => s + x.a, 0), goal = n * H.length;
            const daily = []; for (let d = 1; d <= n; d++) { daily.push(H.length ? H.filter(h => get(h.id).includes(d)).length / H.length : 0) }
            return { n, per, done, goal, daily }
        }
        function renderStats() {
            const { n, per, done, goal, daily } = stats(); const p = goal ? done / goal : 0;
            $('#kp').innerHTML = `<div class="kpi"><b>${goal}</b><span>Goal</span></div><div class="kpi"><b>${done}</b><span>Completed</span></div><div class="kpi"><b>${goal - done}</b><span>Left</span></div>`;
            const r = 42, c = 2 * Math.PI * r;
            $('#donut').innerHTML = `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--fill)" stroke-width="16" stroke-dasharray="${c * p} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)">${(p * 100).toFixed(1)}%</text></svg>`;
            const w = n * 20; let b = `<svg viewBox="0 0 ${w} 130" width="100%" preserveAspectRatio="none" style="height:150px">`;
            [0, .5, 1].forEach(g => b += `<line x1="0" x2="${w}" y1="${110 - g * 100}" y2="${110 - g * 100}" stroke="var(--line)"/>`);
            daily.forEach((v, i) => { b += `<rect x="${i * 20 + 3}" y="${110 - v * 100}" width="14" height="${v * 100}" fill="var(--fill)"/>`; if ((i + 1) % 5 == 0 || i == 0) b += `<text x="${i * 20 + 10}" y="126" font-size="10" text-anchor="middle" fill="var(--mut)">${i + 1}</text>` });
            $('#bars').innerHTML = b + '</svg>';
            let t = `<table class="a"><tr><th>Habit</th><th>Goal</th><th>Done</th><th>Left</th><th style="width:30%">Progress</th><th>%</th></tr>`;
            per.forEach(x => t += `<tr><td>${x.h.name}</td><td>${n}</td><td>${x.a}</td><td>${n - x.a}</td><td><div class="pb"><i style="width:${x.p}%"></i></div></td><td>${x.p}%</td></tr>`);
            $('#an').innerHTML = t + '</table>';
            $('#top').innerHTML = [...per].sort((a, b) => b.a - a.a).slice(0, 10).map((x, i) => `<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)"><b style="width:20px">${i + 1}</b><span style="flex:1">${x.h.name}</span><span>${x.p}%</span></div>`).join('')
        }
        function renderGrid() {
            const n = dim(), H = S.habits, ex = S.extra[ym()] || { m: {}, s: {} };
            const wd = d => "SMTWTFS"[new Date(Y, M, d).getDay()];
            let t = `<table class="g"><tr><th class="n" style="font-size:11px">${MN[M]} ${Y}</th>`;
            for (let d = 1; d <= n; d++)t += `<th>${wd(d)}<br><b style="color:var(--ink)">${d}</b></th>`; t += '</tr>';
            H.forEach(h => {
                t += `<tr><td class="n">${h.name}${editing ? ` <button class="del" data-ren="${h.id}">✎</button><button class="del" data-del="${h.id}">×</button>` : ''}</td>`;
                const g = get(h.id); for (let d = 1; d <= n; d++)t += `<td class="c"><input type="checkbox" data-h="${h.id}" data-d="${d}" ${g.includes(d) ? 'checked' : ''}></td>`; t += '</tr>'
            });
            [['Mood (1-5)', 'm'], ['Sleep (hrs)', 's']].forEach(([l, k]) => { t += `<tr><td class="n">${l}</td>`; for (let d = 1; d <= n; d++)t += `<td class="c"><input class="x" inputmode="decimal" data-k="${k}" data-d="${d}" value="${ex[k][d] ?? ''}"></td>`; t += '</tr>' });
            $('#grid').innerHTML = t + '</table>'
        }
        $('#grid').addEventListener('change', e => {
            const el = e.target;
            if (el.dataset.h) { const k = ym() + '|' + el.dataset.h, d = +el.dataset.d; let a = S.checks[k] || []; a = el.checked ? [...a, d] : a.filter(x => x !== d); S.checks[k] = a; save(); renderStats() }
            else if (el.dataset.k) { const e2 = S.extra[ym()] = S.extra[ym()] || { m: {}, s: {} }; e2[el.dataset.k][el.dataset.d] = el.value; save() }
        });
        $('#grid').addEventListener('click', e => {
            const d = e.target.dataset;
            if (d.del && confirm('Delete this habit?')) { S.habits = S.habits.filter(h => h.id !== d.del); save(); renderAll() }
            if (d.ren) { const h = S.habits.find(h => h.id === d.ren), v = prompt('Rename habit', h.name); if (v) { h.name = v; save(); renderAll() } }
        });
        $('#add').onclick = () => { const v = prompt('New habit (add an emoji if you like)'); if (v) { S.habits.push({ id: 'h' + Date.now(), name: v }); save(); renderAll() } };
        $('#edit').onclick = () => { editing = !editing; $('#edit').textContent = editing ? 'Done' : 'Edit habits'; renderGrid() };
        $('#mo').innerHTML = MN.map((m, i) => `<option value="${i}">${m}</option>`).join('');
        $('#mo').value = M; $('#yr').value = Y;
        $('#mo').onchange = e => { M = +e.target.value; renderAll() };
        $('#yr').onchange = e => { Y = +e.target.value || Y; renderAll() };
        function renderAll() { renderGrid(); renderStats() }
        renderAll();
    </script>
</body>

</html>
